name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m py_compile bridge.py
      - run: python bridge.py --config selftest-config.json --selftest "只回复两个字：你好"
